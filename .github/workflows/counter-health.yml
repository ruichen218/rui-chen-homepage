name: Counter cloud health

# UTC minute 23 avoids the busier start of the hour. GitHub schedules run on
# the default branch and can be delayed/dropped; public-repository schedules
# are disabled after 60 days without repository activity. Check the Actions tab.
# https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#schedule
on:
  schedule:
    - cron: '23 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/counter-health.yml'
      - 'counter-service/src/**'
      - 'counter-service/maintenance/**'
      - 'counter-service/scripts/**'
      - 'assets/counter*.js'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: counter-cloud-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Stable releases and immutable commits verified against official repos.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check public APIs and maintenance freshness
        run: node counter-service/scripts/cloud-health.mjs

# No custom notification secret is needed. Failed-run notifications depend on
# the recipient's GitHub Actions email/web settings, not merely a failed exit.
# Scheduled-run recipient can change when cron is edited or a job re-enabled.
# https://docs.github.com/en/actions/concepts/workflows-and-actions/notifications-for-workflow-runs
